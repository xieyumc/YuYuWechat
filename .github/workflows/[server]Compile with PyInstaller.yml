name: server_Compile with PyInstaller

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./YuYuWechatV2_Server
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations (prepare sqlite)
        run: |
          python manage.py migrate --noinput

      - name: Ensure default WeChatConfig exists
        run: |
          python -c 'import os, django; os.environ.setdefault("DJANGO_SETTINGS_MODULE","YuYuWechatV2.settings"); django.setup(); from wechat_app.models import WeChatConfig; WeChatConfig.objects.get_or_create(defaults={"path": r"C:\\Program Files\\Tencent\\WeChat\\WeChat.exe", "locale": "zh-CN"})'

      - name: Compile with PyInstaller
        run: |
          pip install --upgrade pyinstaller
          pyinstaller YuYuWechatV2_Server.spec

      - name: Copy sqlite DB into dist
        run: |
          if (Test-Path .\db.sqlite3) {
            New-Item -ItemType Directory -Force -Path .\dist\YuYuWechatV2 | Out-Null
            Copy-Item -Force .\db.sqlite3 .\dist\YuYuWechatV2\db.sqlite3
          }

      - name: Run server (bat) and wait for readiness
        id: run_test
        run: |
          $proc = Start-Process -FilePath ".\dist\YuYuWechatV2_Server_run.bat" -NoNewWindow -PassThru
          $maxRetries = 30
          $success = $false
          for ($i = 0; $i -lt $maxRetries; $i++) {
            try {
              $response = Invoke-RestMethod -Uri http://127.0.0.1:8000/wechat/ping/ -UseBasicParsing -TimeoutSec 3
              Write-Output "Attempt $($i+1): $($response | ConvertTo-Json -Compress)"
              if ($response.status -eq "pong") { $success = $true; break }
            } catch {
              Write-Output "Attempt $($i+1): server not ready yet ($_)."
            }
            Start-Sleep -Seconds 2
          }
          if ($success) {
            Write-Output "Test passed"
            echo "test_passed=true" >> $env:GITHUB_ENV
          } else {
            Write-Output "Server did not become ready in time"
            exit 1
          }

      - name: Upload release exe
        if: env.test_passed == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./YuYuWechatV2_Server/dist/YuYuWechatV2_Server.exe
          asset_name: YuYuWechatV2_Server.exe
          asset_content_type: application/octet-stream

      - name: Upload release bat
        if: env.test_passed == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./YuYuWechatV2_Server/dist/YuYuWechatV2_Server_run.bat
          asset_name: YuYuWechatV2_Server_run.bat
          asset_content_type: application/octet-stream
