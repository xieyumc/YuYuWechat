{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block header %}Dashboard{% endblock %}

{% block content %}
<div class="row">
    <!-- Connection Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">连接服务器</h5>
                <form id="connectForm" method="post" action="">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <span id="pingStatus" class="d-inline-block rounded-circle bg-secondary" style="width: 12px; height: 12px;"></span>
                        </span>
                        <input type="text" id="server_ip" name="server_ip" class="form-control" placeholder="Enter Server IP">
                    </div>
                    <div id="pingMessage" class="text-muted small mb-2">检查中...</div>
                    <div class="mt-auto btn-group w-100">
                        <button type="button" onclick="connectServer()" class="btn btn-primary">测试连接</button>
                        <button type="button" onclick="updateServerIP()" class="btn btn-success">保存IP</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- WeChat Status Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">微信状态</h5>
                <div class="d-flex align-items-center mb-3">
                    <span id="wechatStatus" class="d-inline-block rounded-circle bg-secondary me-3" style="width: 12px; height: 12px;"></span>
                    <span id="wechatMessage">检查中...</span>
                </div>
                <div class="mt-auto d-grid">
                    <button type="button" onclick="checkWeChatStatus()" class="btn btn-info">重新检测</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Celery Status Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">定时任务状态</h5>
                <div class="d-flex align-items-center mb-3">
                    <span id="celeryStatus" class="d-inline-block rounded-circle bg-secondary me-3" style="width: 12px; height: 12px;"></span>
                    <span id="celeryMessage">检查中...</span>
                </div>
                <div class="mt-auto btn-group w-100">
                    <button type="button" onclick="startCelery()" class="btn btn-success">启动</button>
                    <button type="button" onclick="stopCelery()" class="btn btn-danger">停止</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Detection Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">错误检测</h5>
                <div class="d-flex align-items-center mb-3">
                    <span id="errorStatus" class="d-inline-block rounded-circle bg-secondary me-3" style="width: 12px; height: 12px;"></span>
                    <span id="errorMessage">检查中...</span>
                </div>
                <div class="mt-auto d-grid">
                    <button type="button" onclick="viewErrors()" class="btn btn-warning">查看错误</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Email Alert Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">邮箱报警</h5>
                <div class="d-flex align-items-center mb-3">
                    <span id="emailStatus" class="d-inline-block rounded-circle bg-secondary me-3" style="width: 12px; height: 12px;"></span>
                    <span id="emailMessage">检查中...</span>
                </div>
                <div class="mt-auto btn-group w-100">
                    <button type="button" onclick="sendTestEmail()" class="btn btn-primary">发送测试邮件</button>
                    <button type="button" onclick="window.open('{% url 'admin:client_app_emailsettings_add' %}', '_blank')" class="btn btn-secondary">邮箱配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Database Management Card -->
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">数据库管理</h5>
                <div class="mt-auto">
                    <form method="post" action="{% url 'import_database' %}" enctype="multipart/form-data" class="mb-3">
                        {% csrf_token %}
                        <div class="input-group">
                            <input type="file" name="db_file" class="form-control" required>
                            <button type="submit" class="btn btn-success">导入</button>
                        </div>
                    </form>
                    <form method="post" action="{% url 'export_database' %}">
                        {% csrf_token %}
                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger">导出</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Tasks Card -->
    <div class="col-md-12 col-lg-12 mb-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">最近执行的任务</h5>
                <div id="taskLogContainer" class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>任务名称</th>
                                <th>时间</th>
                                <th>状态</th>
                                <th>详情</th>
                            </tr>
                        </thead>
                        <tbody id="taskLogBody">
                            <!-- Task logs will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateStatusIndicator(element, state, message) {
        const indicator = document.getElementById(element);
        const messageEl = document.getElementById(element.replace('Status', 'Message'));
        
        // Remove only the color classes, preserving layout classes like me-3
        indicator.classList.remove('bg-success', 'bg-danger', 'bg-warning', 'bg-secondary');

        // Add the new color class based on the state
        if (state === 'success') {
            indicator.classList.add('bg-success');
        } else if (state === 'error') {
            indicator.classList.add('bg-danger');
        } else if (state === 'loading') {
            indicator.classList.add('bg-warning');
        } else {
            indicator.classList.add('bg-secondary');
        }

        if (messageEl) {
            messageEl.textContent = message;
        }
    }

    function connectServer() {
        const serverIp = document.getElementById('server_ip').value;
        updateStatusIndicator('pingStatus', 'loading', '检查连接...');

        fetch('{% url "ping_server" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 'server_ip': serverIp })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                updateStatusIndicator('pingStatus', 'success', '已连接到服务器');
            } else {
                updateStatusIndicator('pingStatus', 'error', data.message || '未连接到服务器');
            }
        })
        .catch(error => {
            updateStatusIndicator('pingStatus', 'error', '未连接到服务器');
            console.error('Error:', error);
        });
    }

    function updateServerIP() {
        const serverIp = document.getElementById('server_ip').value;
        fetch('{% url "set_server_ip" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 'server_ip': serverIp })
        })
        .then(response => {
            if (response.ok) {
                alert('Server IP updated to: ' + serverIp);
            } else {
                throw new Error('Failed to update server IP.');
            }
        })
        .catch(error => {
            alert(error.message);
            console.error('Error:', error);
        });
    }

    function startCelery() {
        updateStatusIndicator('celeryStatus', 'loading', '启动中...');
        fetch('{% url "start_celery" %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        })
        .then(response => {
            if (response.ok) {
                setTimeout(checkCeleryStatus, 1000);
            } else {
                alert('启动 Celery 失败');
                updateStatusIndicator('celeryStatus', 'error', '启动失败');
            }
        })
        .catch(error => {
            alert('启动 Celery 失败: ' + error.message);
            updateStatusIndicator('celeryStatus', 'error', '启动失败');
            console.error('Error:', error);
        });
    }

    function stopCelery() {
        updateStatusIndicator('celeryStatus', 'loading', '停止中...');
        fetch('{% url "stop_celery" %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        })
        .then(response => {
            if (response.ok) {
                setTimeout(checkCeleryStatus, 4000);
            } else {
                alert('取消 Celery 失败');
                updateStatusIndicator('celeryStatus', 'error', '停止失败');
            }
        })
        .catch(error => {
            alert('取消 Celery 失败: ' + error.message);
            updateStatusIndicator('celeryStatus', 'error', '停止失败');
            console.error('Error:', error);
        });
    }

    function checkCeleryStatus() {
        fetch('{% url "check_celery_running" %}')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'Celery is running') {
                    updateStatusIndicator('celeryStatus', 'success', 'Celery 正在运行');
                } else {
                    updateStatusIndicator('celeryStatus', 'error', 'Celery 未运行');
                }
            })
            .catch(error => {
                updateStatusIndicator('celeryStatus', 'error', '状态检查失败');
                console.error('Error:', error);
            });
    }

    function fetchServerIP() {
        fetch('{% url "get_server_ip" %}')
            .then(response => response.json())
            .then(data => {
                document.getElementById('server_ip').value = data.server_ip;
                connectServer();
            })
            .catch(error => {
                console.error('Failed to fetch server IP:', error);
            });
    }

    function checkWeChatStatus() {
        updateStatusIndicator('wechatStatus', 'loading', '检查中...');
        fetch('{% url "check_wechat_status" %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                updateStatusIndicator('wechatStatus', 'success', '微信在线');
            } else {
                updateStatusIndicator('wechatStatus', 'error', data.message || '微信不在线');
            }
        })
        .catch(error => {
            updateStatusIndicator('wechatStatus', 'error', '状态检查失败');
            console.error('Error:', error);
        });
    }

    function checkErrors() {
        updateStatusIndicator('errorStatus', 'loading', '检查中...');
        fetch('{% url "check_errors" %}', {
            method: 'GET',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        })
        .then(response => response.json())
        .then(data => {
            if (data.errors === 0) {
                updateStatusIndicator('errorStatus', 'success', '没有检测到错误');
            } else {
                updateStatusIndicator('errorStatus', 'error', `检测到 ${data.errors} 个错误`);
            }
        })
        .catch(error => {
            updateStatusIndicator('errorStatus', 'error', '状态检查失败');
            console.error('Error:', error);
        });
    }

    function viewErrors() {
        window.location.href = '{% url "error_detection" %}';
    }

    function checkEmailSettings() {
        updateStatusIndicator('emailStatus', 'loading', '检查中...');
        fetch('{% url "check_email_settings" %}')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    updateStatusIndicator('emailStatus', 'success', '运行中');
                } else {
                    updateStatusIndicator('emailStatus', 'error', data.message);
                }
            })
            .catch(error => {
                updateStatusIndicator('emailStatus', 'error', '状态检查失败');
                console.error('Error:', error);
            });
    }

    function sendTestEmail() {
        fetch('{% url "send_email" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                'subject': 'YuYuWechat测试邮件',
                'message': '邮件自动报警功能正常'
            })
        })
        .then(response => {
            if (response.ok) {
                alert('测试邮件发送成功');
            } else {
                throw new Error('发送测试邮件失败');
            }
        })
        .catch(error => {
            alert('测试邮件发送失败: ' + error.message);
            console.error('Error:', error);
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        const delay = ms => new Promise(res => setTimeout(res, ms));
        
        async function initDashboard() {
            await delay(200);
            fetchServerIP();
            await delay(200);
            checkWeChatStatus();
            await delay(200);
            checkCeleryStatus();
            await delay(200);
            checkErrors();
            await delay(200);
            checkEmailSettings();
        }

        initDashboard();

        function fetchTaskLogs() {
            fetch('{% url "get_task_logs" %}')
                .then(response => response.json())
                .then(data => {
                    const taskLogBody = document.getElementById('taskLogBody');
                    taskLogBody.innerHTML = ''; // Clear existing logs
                    data.forEach(log => {
                        const row = `<tr>
                            <td>${log.task_name}</td>
                            <td>${log.timestamp}</td>
                            <td><span class="badge bg-${log.status === 'success' ? 'success' : 'danger'}">${log.status}</span></td>
                            <td>${log.details}</td>
                        </tr>`;
                        taskLogBody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error fetching task logs:', error));
        }

        fetchTaskLogs();
        setInterval(fetchTaskLogs, 5000); // Refresh every 5 seconds
    });
</script>
{% endblock %}
